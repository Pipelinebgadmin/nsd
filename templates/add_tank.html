{% extends "base.html" %}
{% block content %}

<style>
  /* Kill all container width caps — force full-width dashboard */
  .container,
  .container-sm,
  .container-md,
  .container-lg,
  .container-xl,
  .container-xxl,
  .container-fluid {
    max-width: 100% !important;
    width: 100% !important;
    margin-left: 0 !important;
    margin-right: 0 !important;
    padding-left: 1.25rem !important;
    padding-right: 1.25rem !important;
  }
</style>

<h2 class="section-title" style="margin-top: -6px;">
  New Tank — {{ location.get('name','Location') }}
</h2>

{% if errors %}
  <ul class="errors">
    {% for e in errors %}<li>{{ e }}</li>{% endfor %}
  </ul>
{% endif %}

<div class="card section-card shadow-sm">
  <div class="card-body">
    <form method="POST" action="{{ url_for('add_tank', location_id=location.get('id')) }}">

      <div class="row-form">
        <label for="name">Tank Name *</label>
        <input id="name" name="name" type="text" value="{{ form.get('name','') }}" placeholder="e.g., Tank 1" required>
      </div>

      <div class="row-form">
        <label for="capacity_gal">Capacity (GAL) *</label>
        <input id="capacity_gal" name="capacity_gal" type="number" step="0.01" min="0" value="{{ form.get('capacity_gal','5000') }}" required>
      </div>

      <div class="row-form">
        <label for="notes">Notes</label>
        <textarea id="notes" name="notes" placeholder="Optional notes">{{ form.get('notes','') }}</textarea>
      </div>

      <div class="row-form" style="justify-content:flex-end; gap:8px;">
        <a href="{{ url_for('tanks_page', location_id=location.get('id')) }}" class="btn btn-outline-secondary btn-sm">Cancel</a>
        <button class="btn btn-primary btn-sm" type="submit">Create Tank</button>
      </div>

    </form>
  </div>
</div>

<div class="text-center text-muted mt-3">
  <small>Add tank • NStock</small>
</div>

{% endblock %}
